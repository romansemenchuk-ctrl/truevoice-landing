<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#060607"/>
<title>TRUE VOICE — Роман Семенчук · 7 днів до живого звучання</title>
<meta name="description" content="7-денний онлайн-курс Романа Семенчука. Соматичний підхід до голосу: дихання, тіло, звук. 7 практик через Telegram-бот. Старт завтра. 14 днів гарантії повернення."/>

<!-- Open Graph -->
<meta property="og:title" content="TRUE VOICE — 7 днів до живого звучання"/>
<meta property="og:description" content="Соматичний підхід до голосу від Романа Семенчука. 7 практик через Telegram-бот. 15$."/>
<meta property="og:type" content="website"/>
<meta property="og:locale" content="uk_UA"/>

<!-- Preload critical font -->
<link rel="preload" href="fonts/stratosweb-bold-TRIAL.woff" as="font" type="font/woff" crossorigin/>

<!-- Google Fonts: Oswald (kinetic display) + Manrope (body) -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<!-- Design tokens + base styles -->
<link rel="stylesheet" href="colors_and_type.css"/>
<link rel="stylesheet" href="styles.css"/>

<!-- Remix moodboard skin (loads after base to override) -->
<link rel="stylesheet" href="remix.css"/>
<link rel="stylesheet" href="remix-2.css"/>

<style>
  html, body { background: #060607; }
  #root { min-height: 100svh; }

  /* boot splash — single pulsing dot, fades out after mount */
  .tv-boot {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #060607;
    z-index: 200; pointer-events: none;
    transition: opacity 600ms ease-out;
  }
  .tv-boot.gone { opacity: 0; }
  .tv-boot .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #E60012; box-shadow: 0 0 22px rgba(230,0,18,0.7);
    animation: tvPulse 1.3s ease-in-out infinite;
  }

  /* custom cursor hidden on coarse/touch devices */
  * { cursor: none; }
  @media (hover: none), (pointer: coarse) { * { cursor: auto; } }
</style>

<!-- React 18 UMD — same builds + verified hashes as the design prototype -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
        integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
        integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
        integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
        crossorigin="anonymous"></script>
</head>
<body>

<!-- Boot splash -->
<div class="tv-boot" id="tv-boot"><span class="dot"></span></div>

<!-- React root -->
<div id="root"></div>

<!--
  Component loading order matters:
  1. Shared utilities (tweaks, animations)
  2. Section components (sections-a → sections-c)
  3. App entry (app-remix)
-->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="breath.jsx"></script>
<script type="text/babel" src="voice-wall.jsx"></script>
<script type="text/babel" src="voice-ambient.jsx"></script>
<script type="text/babel" src="remix-kinetic.jsx"></script>
<script type="text/babel" src="sections-a.jsx"></script>
<script type="text/babel" src="sections-b.jsx"></script>
<script type="text/babel" src="sections-c.jsx"></script>
<script type="text/babel" src="app-remix.jsx"></script>

<script>
  // Remove boot splash once everything is mounted
  window.addEventListener('load', () => {
    setTimeout(() => {
      const b = document.getElementById('tv-boot');
      if (b) {
        b.classList.add('gone');
        setTimeout(() => b.remove(), 700);
      }
    }, 320);
  });
</script>

</body>
</html>
